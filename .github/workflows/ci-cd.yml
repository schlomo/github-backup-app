name: CI/CD

on:
  push:
    # Only build inputs trigger a branch push (and so a :latest publish on
    # main); docs-only pushes such as the architect's backlog do not. Tag
    # pushes ignore path filters, so releases always run. Pull requests stay
    # unfiltered so their checks always report. Keep this list in step with
    # the allowlist in .dockerignore.
    paths:
      - "github_backup/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".flake8"
      - ".github/workflows/**"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint with flake8
      run: |
        uv run flake8 github_backup/ tests/

    - name: Check code formatting with black
      run: |
        uv run black --check github_backup/ tests/

    - name: Run tests
      run: |
        uv run pytest -q tests/

    - name: Test import
      run: |
        uv run python -c "import github_backup; print('Import successful')"

    - name: Test CLI help
      run: |
        uv run github-backup --help

    - name: Build package
      if: matrix.python-version == '3.14'
      run: uv build

    - name: Check package metadata for PyPI
      if: matrix.python-version == '3.14'
      run: uv run twine check --strict dist/*

    - name: Upload build artifacts
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  docker:
    # main -> :latest and :main, v* tags -> semver tags, pull requests ->
    # :pr-<number> (never :latest) so a PR can be tried before merging.
    # Pull requests from forks and from Dependabot are built but not pushed
    # (their token cannot write packages).
    name: GHCR Release
    runs-on: ubuntu-latest
    needs: test-build
    if: >-
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'pull_request'
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: env.PUSH_IMAGE == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ env.PUSH_IMAGE == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test pushed image
      if: env.PUSH_IMAGE == 'true'
      run: |
        docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} --help

  release:
    # PyPI trusted publishing: PyPI accepts GitHub's short-lived OIDC token
    # for this repository, workflow and environment; no stored secret.
    name: PyPI Release
    runs-on: ubuntu-latest
    needs: test-build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/github-backup-app
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
